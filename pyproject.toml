[project]
name = "podcast-agent"
version = "0.1.0"
description = "播客翻译 Agent"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.43.126",
    "fastapi>=0.162.2",
    "feedparser>=6.0.14",
    "httpx[socks]",
    "mutagen",
    "psycopg[binary]>=3.3.8",
    "redis>=8.1.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest",
]
